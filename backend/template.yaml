AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  URL Crawler App backend — API Gateway, Submit/Crawler/Status Lambdas,
  DynamoDB jobs table, SQS crawl queue, S3 results bucket.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Description: >
      Frontend origins allowed to call this API and fetch from the results
      bucket (e.g. http://localhost:5174,https://app.example.com). Each must
      match a request's Origin header exactly.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10
    MemorySize: 128

Resources:
  JobsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: jobId
        Type: String

  CrawlQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60

  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ['*']
            MaxAge: 3000

  CrawlerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # No built-in Cors property: that only bakes in one static origin.
      # Submit/Status handle CORS themselves (see their OPTIONS events below)
      # so they can reflect an allow-listed Origin per request.

  SubmitFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/submit/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          QUEUE_URL: !Ref CrawlQueue
          ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref JobsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt CrawlQueue.QueueName
      Events:
        SubmitJob:
          Type: Api
          Properties:
            RestApiId: !Ref CrawlerApi
            Path: /jobs
            Method: POST
        SubmitJobOptions:
          Type: Api
          Properties:
            RestApiId: !Ref CrawlerApi
            Path: /jobs
            Method: OPTIONS

  CrawlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/crawler/
      Handler: index.handler
      Runtime: python3.13
      Timeout: 30
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          BUCKET_NAME: !Ref ResultsBucket
          LOG_LEVEL: INFO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - S3CrudPolicy:
            BucketName: !Ref ResultsBucket
      Events:
        CrawlQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt CrawlQueue.Arn
            BatchSize: 1

  CrawlerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CrawlerFunction}"
      RetentionInDays: 14

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/status/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref JobsTable
          BUCKET_NAME: !Ref ResultsBucket
          ALLOWED_ORIGINS: !Join [',', !Ref AllowedOrigins]
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobsTable
        - S3ReadPolicy:
            BucketName: !Ref ResultsBucket
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref CrawlerApi
            Path: /status/{jobId}
            Method: GET
        GetStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref CrawlerApi
            Path: /status/{jobId}
            Method: OPTIONS

  AlertsTopic:
    Type: AWS::SNS::Topic

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One or more 4xx responses from the API in the last 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: url-crawler-backend
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: One or more 5xx responses from the API in the last 5 minutes
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: url-crawler-backend
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

  AlertNotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/alert-notifier/
      Handler: index.handler
      Environment:
        Variables:
          SLACK_WEBHOOK_URL: ''
      Events:
        AlarmNotification:
          Type: SNS
          Properties:
            Topic: !Ref AlertsTopic

  AlertNotifierFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AlertNotifierFunction}"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL for the API Gateway stage
    Value: !Sub "https://${CrawlerApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  JobsTableName:
    Value: !Ref JobsTable
  CrawlQueueUrl:
    Value: !Ref CrawlQueue
  ResultsBucketName:
    Value: !Ref ResultsBucket
